name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle Piper engine (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          PIPER_VERSION: "2023.11.14-2"
        run: |
          set -euo pipefail
          url="https://github.com/rhasspy/piper/releases/download/${PIPER_VERSION}/piper_linux_x86_64.tar.gz"
          tmp="$(mktemp -d)"
          curl -fsSL "$url" | tar xz -C "$tmp"
          cp -R "$tmp/piper/." src-tauri/piper/
          chmod +x src-tauri/piper/piper
          rm -rf "$tmp"

      - name: Bundle Piper engine (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          PIPER_VERSION: "2023.11.14-2"
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/rhasspy/piper/releases/download/$env:PIPER_VERSION/piper_windows_amd64.zip"
          $zip = Join-Path $env:RUNNER_TEMP 'piper.zip'
          $tmp = Join-Path $env:RUNNER_TEMP 'piper'
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          Copy-Item -Path (Join-Path $tmp 'piper\*') -Destination 'src-tauri\piper' -Recurse -Force

      - name: Bundle Piper engine (macOS, universal + signed)
        if: matrix.platform == 'macos-latest'
        env:
          PIPER_VERSION: "2023.11.14-2"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          # rhasspy/piper never shipped a native arm64 macOS build (both the
          # aarch64 and x64 archives contain the same x86_64 binaries), so we
          # bundle x86_64 — native on Intel, Rosetta 2 on Apple Silicon.
          url="https://github.com/rhasspy/piper/releases/download/${PIPER_VERSION}/piper_macos_x64.tar.gz"
          tmp="$(mktemp -d)"
          curl -fsSL "$url" | tar xz -C "$tmp"
          find "$tmp" -type d -name '*.dSYM' -exec rm -rf {} + || true
          dest="$PWD/src-tauri/piper"
          cp -R "$tmp/piper/." "$dest/"
          chmod +x "$dest/piper"

          # Developer-ID sign the nested binaries so the notarized app bundle passes.
          keychain="$RUNNER_TEMP/piper-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/piper-cert.p12"
          security import "$RUNNER_TEMP/piper-cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          rm -f "$RUNNER_TEMP/piper-cert.p12"
          sign() {
            codesign --force --options runtime --timestamp \
              --keychain "$keychain" --sign "$APPLE_SIGNING_IDENTITY" "$1"
          }
          find "$dest" -type f \( -name '*.dylib' -o -name '*.so' -o -name '*.so.*' \) -print0 |
            while IFS= read -r -d '' lib; do sign "$lib"; done
          for exe in piper piper_phonemize espeak-ng; do
            [ -f "$dest/$exe" ] && sign "$dest/$exe"
          done
          security delete-keychain "$keychain" || true

      - name: Write notarization API key
        if: matrix.platform == 'macos-latest'
        run: |
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/apple-api-key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}

      - name: Build, sign, and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: v__VERSION__
          releaseName: "Asakiri Studio v__VERSION__"
          releaseBody: "Download the installer for your platform, or let an existing install update itself."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
