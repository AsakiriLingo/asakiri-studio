name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # GitHub runners resolve apt sources through a mirrorlist that puts the
          # often-flaky Azure mirror first; rewrite it (and any classic sources) to
          # archive.ubuntu.com, and add retries/timeouts so apt never stalls on it.
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          sudo apt-get update -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Piper engine (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          PIPER1_VERSION: "1.7.0"
        run: |
          set -euo pipefail
          src="$(mktemp -d)"
          curl -fsSL "https://github.com/OHF-Voice/piper1-gpl/archive/refs/tags/v${PIPER1_VERSION}.tar.gz" | tar xz -C "$src"
          cd "$src/piper1-gpl-${PIPER1_VERSION}/libpiper"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/install"
          cmake --build build --config Release
          cmake --install build
          dest="$GITHUB_WORKSPACE/src-tauri/piper"
          find install -name 'piper_exe' -type f -exec cp {} "$dest/piper_exe" \;
          find install \( -name 'libpiper.so*' -o -name 'libonnxruntime.so*' \) -exec cp -a {} "$dest/" \;
          cp -R "$(find install -type d -name espeak-ng-data | head -1)" "$dest/espeak-ng-data"
          chmod +x "$dest/piper_exe"
          patchelf --set-rpath '$ORIGIN' "$dest/piper_exe"
          find "$dest" -name 'libpiper.so*' -type f -exec patchelf --set-rpath '$ORIGIN' {} \;

      - name: Build Piper engine (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          PIPER1_VERSION: "1.7.0"
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:RUNNER_TEMP
          Invoke-WebRequest "https://github.com/OHF-Voice/piper1-gpl/archive/refs/tags/v$env:PIPER1_VERSION.tar.gz" -OutFile "$root/p1.tgz"
          tar -xzf "$root/p1.tgz" -C $root
          Set-Location "$root/piper1-gpl-$env:PIPER1_VERSION/libpiper"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/install"
          cmake --build build --config Release
          cmake --install build --config Release
          $dest = "$env:GITHUB_WORKSPACE/src-tauri/piper"
          Get-ChildItem -Recurse install -Filter piper_exe.exe | Select-Object -First 1 | Copy-Item -Destination "$dest/piper_exe.exe" -Force
          Get-ChildItem -Recurse install -Filter *.dll | Copy-Item -Destination $dest -Force
          $data = Get-ChildItem -Recurse -Directory install -Filter espeak-ng-data | Select-Object -First 1
          Copy-Item $data.FullName -Destination "$dest/espeak-ng-data" -Recurse -Force

      - name: Build Piper engine (macOS, arm64 + signed)
        if: matrix.platform == 'macos-latest'
        env:
          PIPER1_VERSION: "1.7.0"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          # Native arm64 build (macos-latest is Apple Silicon). The app bundle is
          # universal, so TTS runs natively on Apple Silicon and is unavailable on
          # Intel Macs.
          dest="$PWD/src-tauri/piper"
          src="$(mktemp -d)"
          curl -fsSL "https://github.com/OHF-Voice/piper1-gpl/archive/refs/tags/v${PIPER1_VERSION}.tar.gz" | tar xz -C "$src"
          cd "$src/piper1-gpl-${PIPER1_VERSION}/libpiper"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/install" -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build --config Release
          cmake --install build
          find install -name 'piper_exe' -type f -exec cp {} "$dest/piper_exe" \;
          find install \( -name 'libpiper.dylib' -o -name 'libonnxruntime*.dylib' \) -exec cp -a {} "$dest/" \;
          cp -R "$(find install -type d -name espeak-ng-data | head -1)" "$dest/espeak-ng-data"
          chmod +x "$dest/piper_exe"
          # Both piper_exe and libpiper reference their dylibs via @rpath; add
          # loader-relative rpaths so they resolve to the folder they sit in.
          install_name_tool -add_rpath @executable_path "$dest/piper_exe" 2>/dev/null || true
          find "$dest" -name 'libpiper.dylib' -exec install_name_tool -add_rpath @loader_path {} \; 2>/dev/null || true

          # Developer-ID sign the nested binaries so the notarized app bundle passes.
          keychain="$RUNNER_TEMP/piper-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          # Remember the current search list so we can restore it (and not clash
          # with tauri-action's own signing keychain afterward).
          orig_keychains="$(security list-keychains -d user | sed -e 's/^[[:space:]]*//' -e 's/"//g')"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          # codesign looks up the identity via the search list, so add our keychain to it.
          security list-keychains -d user -s "$keychain" $orig_keychains
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/piper-cert.p12"
          security import "$RUNNER_TEMP/piper-cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          rm -f "$RUNNER_TEMP/piper-cert.p12"
          sign() {
            codesign --force --options runtime --timestamp \
              --keychain "$keychain" --sign "$APPLE_SIGNING_IDENTITY" "$1"
          }
          find "$dest" -type f -name '*.dylib' -print0 |
            while IFS= read -r -d '' lib; do sign "$lib"; done
          sign "$dest/piper_exe"
          # Restore the original search list and drop our keychain.
          security list-keychains -d user -s $orig_keychains
          security delete-keychain "$keychain" || true

      - name: Write notarization API key
        if: matrix.platform == 'macos-latest'
        run: |
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/apple-api-key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}

      - name: Build, sign, and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: v__VERSION__
          releaseName: "Asakiri Studio v__VERSION__"
          releaseBody: "Download the installer for your platform, or let an existing install update itself."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
